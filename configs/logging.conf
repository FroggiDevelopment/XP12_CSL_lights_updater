{
    "version": 1,
    "disable_existing_loggers": false,
    "formatters": {
        "verbose": {
            "format": "%(name)-s: %(levelname)-s - (%(asctime)s) at line: %(lineno)d in %(filename)s : %(message)s",
            "datefmt": "%Y-%m-%d %H:%M:%S"
        },
        "brief": {
            "format": "%(levelname)-8s: %(message)s"
        }
    },
    "filters": {
        "noinfo": {
            "()": "configs.logfilters.InfoFilter"
        }
    },
    "handlers": {
        "console": {
            "class": "logging.StreamHandler",
            "formatter": "brief",
            "level": "INFO",
            "stream": "ext://sys.stdout"
        },
        "filehandler": {
            "class": "logging.FileHandler",
            "mode": "w",
            "formatter": "verbose",
            "level": "DEBUG",
            "filename": "lights_updater.log",
            "encoding": "utf8",
            "filters": ["noinfo"]
        }
    },
    "loggers": {
        "": {
            "handlers": [
                "console",
                "filehandler"
            ],
            "level": "DEBUG",
            "propagate": true
        },
        "time_benchmark": {
            "handlers": [
                "console",
                "filehandler"
            ],
            "level": "DEBUG",
            "propagate": true
        }
    }
}