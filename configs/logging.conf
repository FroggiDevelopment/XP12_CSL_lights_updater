{
    "version": 1,
    "disable_existing_loggers": true,
    "formatters": {
        "verbose": {
            "format": "%(name)-12s: %(levelname)-8s - (%(asctime)s) at line: %(lineno)d in %(filename)s : %(message)s",
            "datefmt": "%Y-%m-%d %H:%M:%S"
        },
        "brief": {
            "format": "%(name)-12s: %(levelname)-8s : %(message)s",
            "datefmt": "%Y-%m-%d %H:%M:%S"
        }
    },
    "handlers": {
        "console": {
            "class": "logging.StreamHandler",
            "formatter": "brief",
            "level": "INFO",
            "stream": "ext://sys.stdout"
        },
        "filehandler": {
            "class": "logging.FileHandler",
            "formatter": "verbose",
            "level": "DEBUG",
            "filename": "lights_updater.log",
            "encoding": "utf8"
        }
    },
    "loggers": {
        "": {
            "handlers": [
                "console",
                "filehandler"
            ],
            "level": "DEBUG",
            "propagate": true
        }
    }
}